name = "esaad-rewards-app"
main = "worker.ts"
compatibility_date = "2025-02-14"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ADMIN_EMAIL = "admin@esaad.ae"
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
# For sensitive keys (SUPABASE_SERVICE_ROLE_KEY, ADMIN_PASSWORD), set them via:
# npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# npx wrangler secret put ADMIN_PASSWORD
